<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Django Challenge</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fb;
        }

        nav{
            background:#1e3a8a;
            padding:15px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav h2{
            color:white;
        }

        nav ul{
            display:flex;
            list-style:none;
        }

        nav ul li{
            margin-left:25px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-weight:bold;
        }

        .hero{
            text-align:center;
            padding:100px 20px;
        }

        .hero h1{
            font-size:48px;
            color:#1e3a8a;
        }

        .hero p{
            margin-top:20px;
            font-size:20px;
            color:#555;
        }

        .btn{
            display:inline-block;
            margin-top:30px;
            padding:12px 30px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }

        footer{
            text-align:center;
            padding:20px;
            background:#1e3a8a;
            color:white;
            margin-top:120px;
        }
    </style>
</head>
<body>

<nav>
    <h2>Django Challenge</h2>

    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/services/">Services</a></li>
        <li><a href="/contact/">Contact</a></li>
    </ul>
</nav>

<section class="hero">
    <h1>Welcome {{ name }}</h1>
    <p>{{ description }}</p>
    <a href="/about/" class="btn">{{button}}</a>
</section>

<footer>
    © 2026 Sanskar Acharya | 100 Days of Django
</footer>

</body>
</html>

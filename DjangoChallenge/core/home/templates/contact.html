<!DOCTYPE html>
<html>
<head>

<title>Contact</title>

<style>

body{
    margin:0;
    background:#edf3ff;
    font-family:Arial;
}

nav{
    background:#1e3a8a;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    margin:20px;
    text-decoration:none;
    font-weight:bold;
}

.container{
    width:500px;
    margin:60px auto;
    background:white;
    padding:35px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

input,textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<nav>
<a href="/">Home</a>
<a href="/about/">About</a>
<a href="/services/">Services</a>
<a href="/contact/">Contact</a>
</nav>

<div class="container">

<h2>Contact Me</h2>

<form>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Email Address">

<textarea rows="6" placeholder="Write your message"></textarea>

<button>Send Message</button>

</form>

</div>

</body>
</html>
